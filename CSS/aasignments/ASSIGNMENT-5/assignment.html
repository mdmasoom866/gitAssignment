<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Over Scorecard</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #111a2e 0%, #162238 60%, #0d1b11 60%, #0b140d 100%);
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  /* Header */
  .header {
    position: absolute;
    top: 30px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .header span {
    color: #fff;
  }

  .logo-icon {
    font-size: 22px;
  }

  /* Main Container */
  .container {
    display: flex;
    gap: 40px;
    margin-bottom: 40px;
  }

  /* Score Cards */
  .card {
    width: 320px;
    height: 380px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 35px 20px;
    box-sizing: border-box;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .card.ind {
    background-color: #1d5fa8;
  }

  .card.pak {
    background-color: #389438;
  }

  .team-name {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-top: 10px;
  }

  /* Ball circles */
  .balls-container {
    display: flex;
    gap: 8px;
  }

  .ball {
    width: 32px;
    height: 32px;
    background-color: #fff;
    color: #111;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }

  /* Score text */
  .score {
    font-size: 46px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  /* Action Buttons at the bottom */
  .actions {
    display: flex;
    gap: 20px;
    position: absolute;
    bottom: 50px;
  }

  .btn {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 8px 15px rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.3);
  }

  .btn-bat {
    background-color: #f6c443;
    color: #fff;
    font-size: 26px;
  }

  .btn-reset {
    background-color: #e53935;
    color: #fff;
    font-size: 26px;
  }
</style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <div class="logo-icon">🏏</div>
    <span>SUPER OVER</span>
  </div>

  <!-- Score Cards Container -->
  <div class="container">
    <!-- IND Card -->
    <div class="card ind">
      <div class="team-name">IND</div>
      <div class="balls-container">
        <div class="ball">4</div>
        <div class="ball">3</div>
        <div class="ball">2</div>
        <div class="ball">6</div>
        <div class="ball">6</div>
        <div class="ball">6</div>
      </div>
      <div class="score">27 / 0</div>
    </div>

    <!-- PAK Card -->
    <div class="card pak">
      <div class="team-name">PAK</div>
      <div class="balls-container">
        <div class="ball">2</div>
        <div class="ball">4</div>
        <div class="ball">0</div>
        <div class="ball">3</div>
        <div class="ball">1</div>
        <div class="ball">4</div>
      </div>
      <div class="score">14 / 0</div>
    </div>
  </div>

  <!-- Bottom Buttons -->
  <div class="actions">
    <button class="btn btn-bat">🏏</button>
    <button class="btn btn-reset">🔄</button>
  </div>

</body>
</html>
