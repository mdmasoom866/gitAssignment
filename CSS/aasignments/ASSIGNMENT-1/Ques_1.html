<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Quse - 1 */
        .navbar {
            border: 2px solid black;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100vw;
            height: 80px;
            color: rgb(97, 28, 175);
        }

        #logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            
        }

        .nav-links {
            display: flex;
            list-style: disc;
            padding: 0;
            margin: 0;
            gap: 25px;
        }

        .nav-links li {
            display: flex;
        }

        .auth-buttons {
            gap: 10px;
        }

        button {
            padding: 10px 18px;
        }
        a{
            text-decoration: none;
            color: black;
        }
        .fig{
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: blue;
            margin: 10px;
        }
        #btn{
            background-color: blue;
            color: white;
        } 
    </style>
</head>
<body>
    <headed class="navbar">
     <div id="logo">
            <div class="fig"></div>
            <p>CodeAcademy</p>
        </div>

        <ul class="nav-links">
            <a href="">
                <li>Home</li>
            </a>
            <a href="">
                <li>Courses</li>
            </a>
            <a href="">
                <li>Projects</li>
            </a>
            <a href="">
                <li>Contact</li>
            </a>
        </ul>

        <div class="auth-buttons">
            <button>Login</button>
            <button id="btn">Signup</button>
        </div>
    </header> 
</body>
</html>
