<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ludo Board</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }

  .ludo-board {
    display: grid;
    grid-template-columns: repeat(15, 30px);
    grid-template-rows: repeat(15, 30px);
    border: 3px solid #000;
    background-color: #fff;
  }

  .cell {
    border: 1px solid #ccc;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    box-sizing: border-box;
  }

  /* Base Areas (6x6 each) */
  .base-red {
    grid-column: 1 / span 6;
    grid-row: 1 / span 6;
    background-color: red;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .base-green {
    grid-column: 10 / span 6;
    grid-row: 1 / span 6;
    background-color: green;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .base-blue {
    grid-column: 1 / span 6;
    grid-row: 10 / span 6;
    background-color: blue;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .base-yellow {
    grid-column: 10 / span 6;
    grid-row: 10 / span 6;
    background-color: yellow;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Inner White Box inside Bases */
  .inner-base {
    width: 70%;
    height: 70%;
    background-color: white;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    padding: 12px;
    box-sizing: border-box;
  }

  .token-circle {
    border-radius: 50%;
    border: 3px solid;
    width: 24px;
    height: 24px;
    margin: auto;
  }

  .red-circle { border-color: red; }
  .green-circle { border-color: green; }
  .blue-circle { border-color: blue; }
  .yellow-circle { border-color: yellow; }

  /* Paths and Home Stretch */
  .r { background-color: red; }
  .g { background-color: green; }
  .b { background-color: blue; }
  .y { background-color: yellow; }

  /* Center Home Triangles */
  .center-home {
    grid-column: 7 / span 3;
    grid-row: 7 / span 3;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    position: relative;
    overflow: hidden;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<div class="ludo-board">
  <!-- Bases -->
  <div class="base-red">
    <div class="inner-base">
      <div class="token-circle red-circle"></div>
      <div class="token-circle red-circle"></div>
      <div class="token-circle red-circle"></div>
      <div class="token-circle red-circle"></div>
    </div>
  </div>

  <div class="base-green">
    <div class="inner-base">
      <div class="token-circle green-circle"></div>
      <div class="token-circle green-circle"></div>
      <div class="token-circle green-circle"></div>
      <div class="token-circle green-circle"></div>
    </div>
  </div>

  <div class="base-blue">
    <div class="inner-base">
      <div class="token-circle blue-circle"></div>
      <div class="token-circle blue-circle"></div>
      <div class="token-circle blue-circle"></div>
      <div class="token-circle blue-circle"></div>
    </div>
  </div>

  <div class="base-yellow">
    <div class="inner-base">
      <div class="token-circle yellow-circle"></div>
      <div class="token-circle yellow-circle"></div>
      <div class="token-circle yellow-circle"></div>
      <div class="token-circle yellow-circle"></div>
    </div>
  </div>

  <!-- Center Home Triangles -->
  <div class="center-home">
    <div style="position: absolute; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;">
      <div style="background: red; clip-path: polygon(0 0, 0 100%, 50% 50%);"></div>
      <div style="background: green; clip-path: polygon(0 0, 100% 0, 50% 50%);"></div>
      <div style="background: blue; clip-path: polygon(0 100%, 100% 100%, 50% 50%);"></div>
      <div style="background: yellow; clip-path: polygon(100% 0, 100% 100%, 50% 50%);"></div>
    </div>
  </div>

  <!-- Top Column 7, 8, 9 -->
  <div class="cell" style="grid-column: 7; grid-row: 1;"></div>
  <div class="cell g" style="grid-column: 8; grid-row: 1;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 1;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 2;"></div>
  <div class="cell g" style="grid-column: 8; grid-row: 2;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 2;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 3;"></div>
  <div class="cell g" style="grid-column: 8; grid-row: 3;">★</div>
  <div class="cell" style="grid-column: 9; grid-row: 3;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 4;"></div>
  <div class="cell g" style="grid-column: 8; grid-row: 4;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 4;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 5;"></div>
  <div class="cell g" style="grid-column: 8; grid-row: 5;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 5;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 6;"></div>
  <div class="cell g" style="grid-column: 8; grid-row: 6;"></div>
  <div class="cell g" style="grid-column: 9; grid-row: 6;"></div>

  <!-- Row 7 Tracks -->
  <div class="cell" style="grid-column: 1; grid-row: 7;"></div>
  <div class="cell r" style="grid-column: 2; grid-row: 7;">★</div>
  <div class="cell" style="grid-column: 3; grid-row: 7;"></div>
  <div class="cell" style="grid-column: 4; grid-row: 7;"></div>
  <div class="cell" style="grid-column: 5; grid-row: 7;"></div>
  <div class="cell" style="grid-column: 6; grid-row: 7;"></div>

  <div class="cell" style="grid-column: 10; grid-row: 7;"></div>
  <div class="cell" style="grid-column: 11; grid-row: 7;"></div>
  <div class="cell" style="grid-column: 12; grid-row: 7;"></div>
  <div class="cell y" style="grid-column: 13; grid-row: 7;">★</div>
  <div class="cell" style="grid-column: 14; grid-row: 7;"></div>
  <div class="cell" style="grid-column: 15; grid-row: 7;"></div>

  <!-- Row 8 Tracks (Home Stretches) -->
  <div class="cell g" style="grid-column: 6; grid-row: 1;">★</div>
  <div class="cell b" style="grid-column: 2; grid-row: 9;">★</div>
  <div class="cell y" style="grid-column: 14; grid-row: 9;"></div>
  <div class="cell y" style="grid-column: 14; grid-row: 11;">★</div>

  <div class="cell" style="grid-column: 1; grid-row: 8;"></div>
  <div class="cell r" style="grid-column: 2; grid-row: 8;"></div>
  <div class="cell r" style="grid-column: 3; grid-row: 8;"></div>
  <div class="cell r" style="grid-column: 4; grid-row: 8;"></div>
  <div class="cell r" style="grid-column: 5; grid-row: 8;"></div>
  <div class="cell r" style="grid-column: 6; grid-row: 8;"></div>

  <div class="cell y" style="grid-column: 10; grid-row: 8;"></div>
  <div class="cell y" style="grid-column: 11; grid-row: 8;"></div>
  <div class="cell y" style="grid-column: 12; grid-row: 8;"></div>
  <div class="cell y" style="grid-column: 13; grid-row: 8;"></div>
  <div class="cell y" style="grid-column: 14; grid-row: 8;"></div>
  <div class="cell" style="grid-column: 15; grid-row: 8;"></div>

  <!-- Row 9 Tracks -->
  <div class="cell r" style="grid-column: 1; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 2; grid-row: 9;"></div>
  <div class="cell r" style="grid-column: 3; grid-row: 9;">★</div>
  <div class="cell" style="grid-column: 4; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 5; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 6; grid-row: 9;"></div>

  <div class="cell" style="grid-column: 10; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 11; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 12; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 13; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 14; grid-row: 9;"></div>
  <div class="cell" style="grid-column: 15; grid-row: 9;"></div>

  <!-- Bottom Column 7, 8, 9 -->
  <div class="cell b" style="grid-column: 7; grid-row: 10;"></div>
  <div class="cell b" style="grid-column: 8; grid-row: 10;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 10;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 11;"></div>
  <div class="cell b" style="grid-column: 8; grid-row: 11;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 11;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 12;"></div>
  <div class="cell b" style="grid-column: 8; grid-row: 12;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 12;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 13;"></div>
  <div class="cell b" style="grid-column: 8; grid-row: 13;">★</div>
  <div class="cell" style="grid-column: 9; grid-row: 13;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 14;"></div>
  <div class="cell b" style="grid-column: 8; grid-row: 14;"></div>
  <div class="cell" style="grid-column: 9; grid-row: 14;"></div>

  <div class="cell" style="grid-column: 7; grid-row: 15;"></div>
  <div class="cell b" style="grid-column: 8; grid-row: 15;">★</div>
  <div class="cell" style="grid-column: 9; grid-row: 15;"></div>

</div>

</body>
</html>
