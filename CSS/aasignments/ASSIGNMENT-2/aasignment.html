<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            border: 2px solid black;
            background-color: black;
        }

        .nav {
            font-size: 80px;
            color: white;
            text-align: right;
            font-weight: bold;
            margin: 20px;
        }

        .first {
            display: flex;
            justify-content: space-around;
            color: black;
            margin: 10px;
        }

        .one,
        .two,
        .three {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            color: rgb(13, 12, 12);
            background-color: rgb(130, 128, 128);
            font-size: 30px;
            color: white;

        }

        .four,
        .eight,
        .twelve,
        .sixteen {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            color: rgb(13, 12, 12);
            background-color: rgb(220, 151, 54);
            font-size: 30px;
            color: white;


        }

        .second {
            display: flex;
            justify-content: space-around;
            margin: 10px;
        }

        .five,
        .six,
        .seven {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(83, 81, 81);
            font-size: 30px;
            color: white;

        }

        .third {
            display: flex;
            justify-content: space-around;
            margin: 10px;

        }

        .nine,
        .ten,
        .eleven {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(83, 81, 81);
            font-size: 30px;
            color: white;


        }

        .forth {
            display: flex;
            justify-content: space-around;
            margin: 10px;

        }

        .thirteen,
        .fifteen,
        .forteen {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(83, 81, 81);
            font-size: 30px;
            color: white;


        }

        .fifth {
            display: flex;
            justify-content: space-around;
            margin: 10px;

        }

        .seventeen {
            text-align: left;
            width:100px;
            height: 100px;
            border-radius: 50px;
            background-color: rgb(83, 81, 81);
            font-size: 30px;
            color: white;
            padding-right:250px;
        }

        .eighteen {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(83, 81, 81);
            font-size: 30px;
            color: white;

        }

        .ninteen {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            color: rgb(13, 12, 12);
            background-color: rgb(215, 173, 21);
            font-size: 30px;
            color: white;


        }
    </style>
</head>

<body>
    <div class="main">
        <div class="nav">
            <p>7744</p>
        </div>
        <div class="first">
            <button class="one">C</button>
            <button class="two">+/-</button>
            <button class="three">%</button>
            <button class="four">.--.</button>
        </div>
        <div class="second">

            <button class="five">7</button>
            <button class="six">8</button>
            <button class="seven">9</button>
            <button class="eight">X</button>
        </div>
        <div class="third">
            <button class="nine">4</button>
            <button class="ten">5</button>
            <button class="eleven">6</button>
            <button class="twelve">-</button>
        </div>
        <div class="forth">
            <button class="thirteen">1</button>
            <button class="forteen">2</button>
            <button class="fifteen">3</button>
            <button class="sixteen">+</button>
        </div>
        <div class="fifth">
            <button class="seventeen">0</button>
            <button class="eighteen">,</button>
            <button class="ninteen">=</button>
        </div>
    </div>
</body>

</html>
